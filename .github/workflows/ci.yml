# The gates a change must pass before it reaches main.
#
#   backend    every guarantee the product rests on: the confidence gate, the
#              AI-note guards, one farmer never reading another's data, the
#              voice fallback, the closed-form heatmap (needs torch, CPU build)
#   frontend   type-check, lint and a production build of every workspace app
#   hygiene    no secrets anywhere in history, and none of the files that must
#              never be committed (.env, assistant and editor settings)
#
# Tests never call a real service: tests/conftest.py blanks every key and
# forces the stub vision model, so this runs without any secrets configured.
# No step reads event text (PR titles, branch names, commit messages), so
# there is nothing to inject into a shell.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU torch — no GPU on the runner)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.0" "torchvision==0.29.0"
          pip install -r backend/requirements.txt

      - name: Byte-compile the app
        run: python -m compileall -q backend/app

      - name: Tests
        working-directory: backend
        env:
          ANNRAKSHAK_AUTH: "off"
        run: python -m pytest -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (from the lockfile, exactly)
        run: npm ci

      - name: Lint
        run: npm run lint -w frontend/landing

      - name: Type-check and build every app
        run: |
          npm run build -w frontend/landing
          npm run build -w frontend/farmer-app
          npm run build -w frontend/officer-dashboard

  hygiene:
    name: secrets and forbidden files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits to know what to scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan every commit, not just the last

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No files that must never be committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env$|^\.claude/|^\.agents/|^\.cursor/|^\.vscode/|^\.idea/|(^|/)skills-lock\.json$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be in the repository:"
            echo "$bad"
            exit 1
          fi
          echo "clean"
